[project]
name = "streamturbo"
version = "0.1.0"
description = "Real-time sd-turbo Generation between NDI/Spout and TouchDesigner on Windows"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ted Liou" }]
dependencies = [
    "torch==2.14.1",
    "numpy>=2.3",
    "nvidia-ml-py>=13.580",
    "cyndilib==0.1.3",
    "SpoutGL==0.1.1",
    "diffusers>=0.41",
    "transformers>=5.20",
    "huggingface-hub>=1.33",
    "accelerate>=1.15",
    "pillow>=13",
    "pydantic>=2.12",
]

[project.scripts]
streamturbo = "streamturbo.cli:main"

[project.urls]
Repository = "https://github.com/tedliou/StreamTurbo"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12"
# ADR-0001: the lockfile only resolves for Windows x64.
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["gpu: needs an NVIDIA GPU and the real model; excluded from CI"]
