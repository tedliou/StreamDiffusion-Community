name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web Panel lint and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Committed Web Panel build is current
        shell: bash
        run: |
          git add --intent-to-add src/streamturbo/web_panel
          git diff --exit-code --stat -- src/streamturbo/web_panel || {
            echo "::error::The committed Web Panel build is stale: run 'npm run build' in web/ and commit the result."
            exit 1
          }

      - name: Sync
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check

      - name: Pyright
        run: uv run --no-sync pyright

      - name: Pytest
        run: uv run --no-sync pytest -m "not gpu"
